services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${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}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - APP_NAME=${APP_NAME:-FastAPI AI Template}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DEBUG=${DEBUG:-false}
      # Le pasamos la URL a FastAPI para cuando corra dentro de Docker
      - DATABASE_URL=postgresql://admin:password123@db-ia:5432/ia_backend_db
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db-ia  # Le decimos que espere a que la base de datos exista
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- NUESTRO NUEVO SERVICIO DE BASE DE DATOS LOCAL ---
  db-ia:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ia_backend_db
    ports:
      - "5432:5432" # Expone el puerto para que te puedas conectar desde tu entorno local (WSL)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

# volumen para que los datos de Postgres sean persistentes
volumes:
  postgres_data:
